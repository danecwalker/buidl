# Publishes the binaries the README and `buidl init`'s generated workflow tell
# people to curl. Those URLs are hard-coded against the asset names produced
# here (internal/cli/ci_template.go), so renaming an artifact silently breaks
# every generated pipeline in the wild.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading assets is the only write this needs.
      contents: write
    steps:
      # Full history: the version stamp comes from `git describe`, which needs
      # tags and reachable commits. The default shallow fetch has neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      # A tag can be pushed from a branch whose tests never ran. Re-running them
      # here is cheap next to shipping a broken binary under a permanent tag.
      - name: Test
        run: go test ./...

      # `task release` is the same task used locally and in ci.yml's
      # build-matrix, so a release is not built by a recipe that only exists in
      # this file and is therefore only exercised at tag time. It sets
      # CGO_ENABLED=0 (static, no glibc floor) and -trimpath (no build-host
      # paths baked into the binary, so the same source builds byte-identically
      # from any checkout directory).
      - name: Cross-compile and checksum
        run: task release VERSION=${{ github.ref_name }}

      # The tag is the only thing users can see; the version string is the only
      # thing the binary can report. If they disagree, `buidl --version` lies
      # for the lifetime of the release — and a tag cannot be honestly reused.
      # Fail here instead.
      - name: Verify the binary reports the tag
        run: |
          reported="$(./dist/buidl-linux-amd64 --version)"
          echo "$reported"
          case "$reported" in
            *"${{ github.ref_name }}"*) ;;
            *)
              echo "binary reports '$reported' but the tag is '${{ github.ref_name }}'"
              exit 1
              ;;
          esac

      - name: Show artifacts
        run: ls -lh dist/ && cat dist/checksums.txt

      # `gh` over softprops/action-gh-release: it is preinstalled on the runner
      # and already authenticated, so this is the one step in the repo holding a
      # contents:write token and it does not hand that token to a third-party
      # action pinned by a tag someone else can move. --generate-notes gives the
      # same autogenerated changelog the action would.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            dist/buidl-linux-amd64 \
            dist/buidl-linux-arm64 \
            dist/buidl-darwin-amd64 \
            dist/buidl-darwin-arm64 \
            dist/checksums.txt
